name: mariannmt_wrapper_example
description: "Demonstrates how to use the mariannmt_wrapper plugin."
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  mariannmt_wrapper:
    path: ../

  cupertino_icons: ^1.0.8

  archive: ^4.0.7
  http: ^1.6.0
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

