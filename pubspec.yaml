name: mariannmt_wrapper
description: Offline Marian neural machine translation for Flutter through a cross-platform FFI API.
version: 1.0.0
homepage: https://github.com/core-laboratories/mariannmt_wrapper
repository: https://github.com/core-laboratories/mariannmt_wrapper
issue_tracker: https://github.com/core-laboratories/mariannmt_wrapper/issues

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
