name: Publish

on:
  push:
    tags: ["*.*.*"]

jobs:
  validate:
    if: github.repository == 'core-laboratories/mariannmt_wrapper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "${package_version}"
      - run: flutter pub publish --dry-run

  publish:
    needs: validate
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
