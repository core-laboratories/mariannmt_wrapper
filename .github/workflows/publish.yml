name: Publish

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'core-laboratories/mariannmt_wrapper'
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "${package_version}"
      - run: dart pub publish --force
